server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Grants cross-origin isolation, and with it SharedArrayBuffer and
    # multi-threaded WebAssembly. Without the pair the in-browser speech
    # model runs on a single thread, which on the same video is the
    # difference between roughly 13 and 20 seconds of inference.
    #
    # `credentialless` rather than `require-corp`, because the model
    # weights are fetched from a cross-origin host that sends no CORP
    # header and `require-corp` would block them.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    location = /config.js {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    location ~* \.(js|mjs|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        # Repeated because nginx's `add_header` does not inherit into a
        # block that sets one of its own, and the worker entry scripts
        # are served from here: Chrome refuses a module worker whose own
        # response lacks the pair, even under an isolated document.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
